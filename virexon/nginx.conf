# ============================================================
# nginx.conf - Virexon Technical Services LLC
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name virexon.ae www.virexon.ae;
    return 301 https://virexon.ae$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name virexon.ae;

    # SSL Configuration (Update with your certificates)
    ssl_certificate /path/to/certificate.pem;
    ssl_certificate_key /path/to/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/virexon;
    index index.html;

    # ============================================================
    # GZIP Compression
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/x-javascript
               application/json application/xml application/rss+xml
               image/svg+xml font/woff font/woff2;

    # ============================================================
    # Static Assets Cache
    # ============================================================
    location ~* \.(ico|pdf|flv|jpg|jpeg|png|gif|js|css|swf|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # ============================================================
    # HTML Cache
    # ============================================================
    location ~* \.(html|htm)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ============================================================
    # Security Headers
    # ============================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================================
    # 404 Page
    # ============================================================
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ============================================================
    # Prevent Access to Hidden Files
    # ============================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================
    # Prevent Access to Sensitive Directories
    # ============================================================
    location ~ ^/(includes|assets/css|assets/js|assets/images)/ {
        # Allow access to assets but not to includes
        if ($request_uri ~* "^/includes/") {
            return 403;
        }
    }

    # ============================================================
    # Sitemap and Robots
    # ============================================================
    location = /sitemap.xml {
        allow all;
    }
    location = /robots.txt {
        allow all;
    }
}